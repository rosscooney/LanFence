#
# Example LAN Fence configuration. Every field here is optional and shown at
# its default value - copy what you need to override. Pass with
# `lanfence <command> --config config.yaml`.

scan:
  interface: null              # null = auto-detect
  subnet: null                 # null = derive from the interface's own address
  scan_interval_seconds: 60    # how often `monitor` repeats an active sweep
  active_scan_timeout_seconds: 3
  passive: true                # also sniff ARP/ND traffic between sweeps
  ipv6: true                   # also discover devices via IPv6 neighbor discovery
  dhcp_snooping: true          # snoop DHCP for a self-reported hostname (needs passive: true)
  resolve_hostnames: true      # try reverse DNS for each device
  dns_timeout_seconds: 1
  offline_grace_seconds: 180   # how long a missed device stays "online" (not yet confirmed absent)
  offline_after_missed_scans: 3 # ...AND this many consecutive eligible misses, before going offline
  # Both conditions above must be reached before a device is marked offline -
  # and only an active sweep can reach them; elapsed time alone never does.
  # offline_grace_seconds: 0 and offline_after_missed_scans: 1 restores the
  # old immediate-disconnect-on-first-miss behavior.

alerts:
  min_severity: medium         # info | medium | high - dispatch threshold
  rate_limit_seconds: 900      # per-MAC cooldown between alerts; 0 = alert every time
  syslog:
    enabled: false
    address: /dev/log
    facility: user
  email:
    enabled: false
    smtp_host: localhost
    smtp_port: 587
    use_tls: true
    username: null
    password: null
    from_addr: null
    to_addrs: []
  webhook:
    enabled: false
    url: null
    timeout_seconds: 5
  slack:
    enabled: false
    webhook_url: null            # Slack app settings -> Incoming Webhooks
    timeout_seconds: 5
  discord:
    enabled: false
    webhook_url: null            # channel settings -> Integrations -> Webhooks
    timeout_seconds: 5
  teams:
    enabled: false
    webhook_url: null            # incoming webhook / Workflow URL
    timeout_seconds: 5
  ntfy:
    enabled: false
    url: null                    # e.g. https://ntfy.sh/my-lanfence-topic
    priority: null               # min | low | default | high | urgent
    timeout_seconds: 5
  twilio:
    enabled: false
    account_sid: null
    auth_token: null              # sensitive - treat this file like a credential
    from_number: null             # E.164, e.g. "+15551234567"
    to_numbers: []
    timeout_seconds: 10

digest:
  channels: []                  # which alerts.<channel> destinations also get a digest, e.g. [email]
  send_when_empty: false        # `digest --send` skips an empty digest unless this is true (or --send-empty)
  max_devices_per_section: 20   # cap per section before an explicit "and N more"
  # SMS (twilio) and syslog are not available for digest delivery.

dhcp_servers:
  enabled: false                # opt-in - detects DHCP servers not on the approved list below
  approved: []                  # e.g. [{interface: eth0, server_ip: 192.168.1.1, name: Main router}]
  alert_cooldown_seconds: 3600  # per (interface, server) - don't flood findings from one noisy server
  # Needs scan.passive and scan.dhcp_snooping to actually see any DHCP traffic.
  # An empty `approved` list with enabled: true means every server seen is unexpected.

db_path: ~/.local/share/lanfence/lanfence.db
allowlist_file: ~/.config/lanfence/allowlist.yaml
vendor_file: null             # extra OUI table, merged with the packaged one
rogue_signatures_file: null   # extra signatures, merged with the packaged ones
